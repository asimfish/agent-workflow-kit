name: Agent Workflow Check

on:
  pull_request:
  push:

jobs:
  agent-workflow-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate agent workflow documents and commits
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -n "${base:-}" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            python3 tools/agentctl.py check --mode ci --commit-range "$base..HEAD"
          else
            python3 tools/agentctl.py check --mode ci
          fi

      - name: Run loop workflow regression tests
        shell: bash
        run: python3 -m unittest discover -s tests -v

  windows-dispatch-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile workflow controller
        run: python -m py_compile tools/agentctl.py tools/agent_workflow_hook.py

      - name: Verify Windows guidance dispatch
        run: python -m unittest tests.test_guidance_workflow -v
