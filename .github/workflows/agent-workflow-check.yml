name: Agent Workflow Check

on:
  pull_request:
  push:

jobs:
  agent-workflow-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR github.sha is a synthetic merge; validate contributor history.
          # Push runs use the event SHA instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate agent workflow documents and commits
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # New-branch pushes have a zero before SHA; use the default branch.
          if [ -z "${base:-}" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD "origin/${DEFAULT_BRANCH:-}" 2>/dev/null || true)"
          fi

          if [ -n "${base:-}" ] && git cat-file -e "$base^{commit}" 2>/dev/null && [ "$base" != "$(git rev-parse HEAD)" ]; then
            python3 tools/agentctl.py check --mode ci --commit-range "$base..HEAD"
          else
            # HEAD checks reachable history; adoption excludes pre-install commits.
            python3 tools/agentctl.py check --mode ci --commit-range HEAD
          fi

      - name: Run loop workflow regression tests
        shell: bash
        run: python3 -m unittest discover -s tests -v

  windows-dispatch-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile workflow controller
        run: python -m py_compile tools/agentctl.py tools/agent_workflow_hook.py

      - name: Verify Windows guidance dispatch
        run: python -m unittest tests.test_guidance_workflow -v

      - name: Verify Windows run lifecycle and stop tree
        # Exercises the taskkill /T termination branch, supervisor claim
        # confirmation, and replay rejection at runtime instead of relying
        # on static review of the Windows-only code paths.
        run: >-
          python -m unittest -v
          tests.test_execution_lease_workflow.ExecutionLeaseWorkflowRegressionTest.test_only_the_owner_conversation_can_stop_a_run
          tests.test_execution_lease_workflow.ExecutionLeaseWorkflowRegressionTest.test_supervisor_entrypoint_is_single_use
          tests.test_execution_lease_workflow.ExecutionLeaseWorkflowRegressionTest.test_await_supervisor_claim_flags_pre_claim_death_and_slow_start
          tests.test_execution_lease_workflow.ExecutionLeaseWorkflowRegressionTest.test_await_supervisor_claim_sees_through_a_zombie_supervisor
          tests.test_execution_lease_workflow.ExecutionLeaseWorkflowRegressionTest.test_supervisor_argv_survives_tokens_that_start_with_a_dash
